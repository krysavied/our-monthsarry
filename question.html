<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ♡ OUR STORY
        </div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="memories.html">Memories</a>
            <a href="reasons.html">Reasons</a>
            <a href="letter.html">Letter</a>
            <a href="question.html">Question</a>
        </div>

    <main class="question-page">

        <div class="question-heart">
            💗
        </div>

        <p class="little-title">
            SEPTEMBER 30, 2026
        </p>

        <h1>
            Will You Keep<br>
            <span>Choosing Me?</span>
        </h1>

        <p class="question-text">
            Not just today.<br>
            Not just this month.<br>
            But through all the days ahead?
        </p>


        <div class="question-buttons">

            <button onclick="sayYes()" class="yes-button">
                YES, ALWAYS 💗
            </button>

            <button id="noButton" class="no-button">
                No 😭
            </button>

        </div>


        <div id="yesMessage" class="yes-message">

            <div class="big-heart">
                💗
            </div>

            <h2>
                I KNEW IT! 🥺
            </h2>

            <p>
                Happy First Monthsary, Honey!
            </p>

            <p>
                Here's to choosing each other,
                again and again. ♡
            </p>

            <div class="date">
                September 30, 2026
            </div>

        </div>

    </main>


    <!-- MUSIC -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music/music.mp3" type="audio/mpeg">
    </audio>

    <button class="music-button" id="musicButton" onclick="toggleMusic()">
        🎵 Play Music
    </button>
